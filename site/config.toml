base_url = "https://gorilla.primals.eco"
title = "guerillaGorilla — Accountability Infrastructure"
description = "Methodology meta-primal: the Provenance Trio applied to public accountability. fEAR · preSCENT · STRIDe. Pursuit predation as institutional oversight. Infrastructure IS the evidence integrity layer."
compile_sass = false
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
generate_sitemap = true
minify_html = true

[link_checker]
external_level = "warn"
skip_prefixes = [
    "https://cofs.lara.state.mi.us",
    "https://apps.michigan.gov/ichat",
    "https://mdocweb.state.mi.us",
]

# ── Taxonomies — relational layer ────────────────────────────────────────
[[taxonomies]]
name = "capabilities"
feed = true

[[taxonomies]]
name = "cases"
feed = true

[[taxonomies]]
name = "domains"

[markdown]
smart_punctuation = true

[markdown.highlighting]
enabled = true
light_theme = "github-light"
dark_theme = "github-dark"

[search]
include_title = true
include_description = true
include_content = true

[extra]
author = "ecoPrimal"
repo_url = "https://git.primals.eco/protoKarya/guerillaGorilla"
github_url = "https://github.com/protoKarya/guerillaGorilla"

